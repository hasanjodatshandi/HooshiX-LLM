[package]
name = "convert"
description = "Turn a downloaded dataset file into the line-oriented form the pipeline reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
parquet = { workspace = true }
arrow-array = { workspace = true }
# Common Pile publishes raw gzip streams, not tar archives, so `tar` refuses them
# and they have to be decoded here. The pure-Rust backend is named explicitly
# rather than left to whichever feature graph resolves first.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
