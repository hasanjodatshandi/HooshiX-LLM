# Bilingual pilot on the cloud A100.
#
# This is the configuration the plan actually asked for, and the first machine
# that can run it. Every earlier run was shaped by what the hardware allowed:
# the local CPU forced sequence 512 on the pilot, and the 4 GB card could not
# hold this model at all — CubeCL reported out of memory at micro_batch 1 with
# sequence 512, before a single activation. `configs/bilingual-pilot-wgpu.toml`
# records that failure rather than deleting it.
#
# The A100 has 40 GB. What that changes:
#
#   sequence_length  2048 rather than 512. This is the value `stage1-110m.toml`
#                    specifies and the one the bilingual plan was written
#                    against. A 110M model at 8 x 2048 needs about 2 GiB for the
#                    logits projection alone plus 1.6 GiB for the attention
#                    scores, which is why no smaller machine could do it.
#
#   backend         cuda. Built with `--no-default-features --features cuda`,
#                    which compiled clean in 4m17s on this host.
#
#   max_steps       6743, which is one epoch: 110482432 tokens divided by the
#                   16384 tokens an optimizer step now sees. The CPU pilot was
#                   26974 steps at 4096 tokens each; the tokens are the same and
#                   only the shape changed.
#
# Learning rate and schedule are scaled with the batch rather than copied. A
# batch four times larger with the same learning rate is a different experiment,
# and the schedule has to end when the run does or the rate never reaches its
# floor.

version = 2

[model]
vocab_size = 32768
hidden_size = 768
num_layers = 12
num_heads = 12
num_kv_heads = 12
ffn_intermediate_size = 2048
max_sequence_length = 2048
rope_theta = 10000.0
rms_norm_eps = 0.00001
tie_embeddings = true
linear_bias = false

[tokenizer]
vocab_size = 32768
model = "bpe"
artifact = "artifacts/tokenizer-bilingual.json"

[tokenizer.special_tokens]
bos = 0
eos = 1
pad = 2
unk = 3

[data]
data_root = "artifacts/pilot-run/data"
# 1024 rather than 2048, and this is the sweep's answer rather than a guess.
#
# Measured on this card, 6 steps after 1 warmup, one shape at a time:
#
#   1x512     512      3811 tok/s     1x1024   1024      8873
#   2x512    1024      9097           2x1024   2048     15933
#   4x512    2048     15622           4x1024   4096     20574
#   8x1024   8192     20726  <- best 1x2048   2048     13259
#                                     2x2048   4096     14503
#                                     4x2048   8192     FAILED
#                                     8x2048  16384     FAILED
#
# The ceiling is 4096 tokens per micro-batch. The shape that was configured
# before this -- 4 x 2048, which is 8192 -- is above it and fails, so the run
# would have died again for a second time at the same wall.
#
# 8 x 1024 is both the largest shape that fits and the fastest measured, so the
# batch was not traded away for memory. The effective batch falls from 16384 to
# 8192 tokens, and the step count doubles to compensate; the learning rate is
# halved with it, because a batch half the size at the same rate is a different
# experiment.
#
# Why the ceiling sits where it does is not settled. The attention score matrix
# at 4x2048 is 768 MB per layer and 9.2 GB across twelve, which with parameters,
# gradients, optimizer state and logits comes to about 18 GB -- well inside 40.
# Something holds roughly twice what the tensors account for, and the sweep shows
# the ceiling tracks the shape without explaining the gap. That is recorded as an
# open question rather than dressed up as a finding.
sequence_length = 1024
micro_batch_size = 8
shuffle_seed = 0
validation_basis_points = 100
test_basis_points = 100
split_seed = 0

[training]
max_steps = 13486
data_parallel_world_size = 1
gradient_accumulation_steps = 1
seed = 0
gradient_clip_global_norm = 1.0
checkpoint_interval_steps = 250
# Pushed past the end of the run, and this is a workaround rather than a choice.
#
# The validation pass is what exhausted the card. At 8 x 1024 with evaluation
# every 100 steps the run died at step 91; the same shape with evaluation moved
# out of the way has run past step 500 at 27469 MiB and 98 percent utilisation.
#
# The mechanism is plausible and has not been confirmed: `validate` runs four
# forward passes over the validation batches while whatever the training step
# still holds is resident, and at this shape one forward pass materialises a
# gigabyte of logits. Four of those alongside the training graph is the extra the
# card cannot take.
#
# So the cost of this line is the validation curve, which is exactly the thing
# added to apps/train two days ago so that a run could be watched for
# memorisation. Losing it for the pilot is a real loss and the smaller one: the
# alternative measured here is a run that stops at step 91.
#
# The defect to fix is that evaluation and training share a memory budget they
# should not. Until that is fixed, any run with a validation curve at this scale
# will meet the same wall.
evaluation_interval_steps = 100000

[training.optimizer]
learning_rate = 0.0003
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
epsilon = 1e-8

[training.scheduler]
warmup_steps = 300
cosine_iters = 13486

[generation]
max_new_tokens = 128
seed = 0
stop_on_eos = true

[generation.strategy]
kind = "greedy"

[runtime]
backend = "flex"
precision = "f32"
