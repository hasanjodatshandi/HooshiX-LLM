[package]
name = "llm-training"
description = "Training-loop orchestration: one optimization step and the loop around it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
llm-core = { workspace = true }
llm-model = { workspace = true }
llm-checkpoint = { workspace = true }
burn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
mimalloc = { version = "0.1", optional = true }

[features]
# A binary needs exactly one execution backend, and so does the throughput
# example. `flex` is the deterministic CPU reference path and the default; the
# others are selected with `--no-default-features --features <name>`.
default = ["flex"]
flex = ["burn/flex"]
cpu = ["burn/cpu"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
# Experiment only: the ndarray backend, which is the only path to a real BLAS.
ndarray = ["burn/ndarray"]
# Experiment only: swaps the system allocator in the throughput example, so the
# allocator can be measured without changing the library crates.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
# Tests need a concrete backend before a `Device` can be built; the default
# feature supplies it.
burn = { workspace = true }

[lints]
workspace = true
